[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic_flow_models"
version = "1.1.0"
license = "MIT"
description = "Macroscopic traffic flow models (CTM, METANET), ramp metering and calibration"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Julius Schlapbach", email = "juliussc@ethz.ch" }
]

# Runtime dependencies
dependencies = [
  "numpy==2.3.4",
  "scipy==1.16.3",
  "matplotlib==3.10.7",
  "casadi==3.7.2",
  "networkx==3.5",
  "opencv-python==4.13.0.92",
  "tqdm==4.67.1",
]

# Development / testing dependencies
[project.optional-dependencies]
dev = [
  "pytest==9.0.0",
  "pylint==4.0.4",
  "mypy==2.4.1",
  "scipy-stubs==1.16.3.3",
  "numpy-typing-compat==20251206.2.3",
  "types-networkx==3.5.0.20251106",
  "types-tqdm==4.67.3.20260518",
  "git-cliff==2.11.0",
  "mkdocs-material>=9.5.5",
  "mkdocstrings[python]>=0.25",
]

# Documentation-only install (used by CI deploy job)
docs = [
  "mkdocs-material>=9.5.5",
  "mkdocstrings[python]>=0.25",
]

[tool.setuptools]
package-dir = { "" = "src" }

# ships the PEP 561 marker so type checkers use the package's inline annotations
[tool.setuptools.package-data]
traffic_flow_models = ["py.typed"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["traffic_flow_models"]
warn_unreachable = true

# casadi ships no type information and no stub package exists
[[tool.mypy.overrides]]
module = ["casadi", "casadi.*"]
ignore_missing_imports = true

# the casadi `# type: ignore`s in the model graphs are for pyright, which infers casadi's
# incorrect SWIG signatures; mypy sees casadi as Any and would report them as unused
[[tool.mypy.overrides]]
module = ["traffic_flow_models.model.ctm", "traffic_flow_models.model.metanet"]
warn_unused_ignores = false
